name: Ralph eval

# End-to-end eval for ralph mode (issue groups). It drives the deployed agent
# against a dedicated Linear fixture and is authenticated, deployment-dependent,
# and spins a real Vercel Sandbox - so it runs weekly and on demand, never on
# pull requests. Opt in by setting the repo variable EVE_DEPLOYMENT_URL to the
# target; the job is skipped until it is set.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"

permissions:
  contents: read

jobs:
  ralph-eval:
    if: ${{ vars.EVE_DEPLOYMENT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ralph end-to-end eval against the deployment
        run: pnpm exec eve eval ralph --strict --url "$EVE_DEPLOYMENT_URL"
        env:
          # Deployment target (repo variable) and the Linear test group
          # "<parent> <ready> <blocked>". Without the fixture the eval self-skips.
          EVE_DEPLOYMENT_URL: ${{ vars.EVE_DEPLOYMENT_URL }}
          RALPH_EVAL_GROUP: ${{ secrets.RALPH_EVAL_GROUP }}
          # Auth for --url against the deployment: bearer token, plus the
          # deployment-protection bypass when protection is on.
          EVE_EVAL_AUTH_TOKEN: ${{ secrets.EVE_EVAL_AUTH_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
