<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ts-rogue</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #min-size-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #e5e515;
        background: #000;
        font-family: monospace;
        font-size: 16px;
        text-align: center;
        padding: 1em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="min-size-overlay"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
