packages:
  - "."
  - "src/web"

catalog:
  # Root and web share this version because the web package builds the agent.
  eve: "^0.52.4"

allowBuilds:
  esbuild: true
  node-pty: true
  sharp: false

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
  - sandbox@3.5.2
